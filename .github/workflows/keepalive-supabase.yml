name: Keep Supabase Alive

on:
  schedule:
    # Keep the Free tier project active with a light request three times weekly.
    - cron: '0 0 * * 0,2,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Ping Supabase health endpoint
        run: |
          curl --fail --silent --show-error --location \
            "${SUPABASE_URL%/}/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Probe leaderboard table
        run: |
          status="$(curl --silent --show-error --location \
            "${SUPABASE_URL%/}/rest/v1/leaderboard_entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "%{http_code}")"
          echo "leaderboard_entries HTTP $status"
          if [ "$status" != "200" ]; then
            echo "The health check passed, but leaderboard_entries is not reachable yet. Run the SQL in docs/CLOUD_SETUP.md to enable cloud leaderboards."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
